name: Build itlwm and AirportItlwm

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.scheme }} (${{ matrix.configuration }})
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        scheme: [itlwm, AirportItlwm-Sequoia, AirportItlwm-Tahoe]
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install MacKernelSDK
        uses: actions/checkout@v4
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: MacKernelSDK

      - name: Build ${{ matrix.scheme }}
        env:
          SCHEME: ${{ matrix.scheme }}
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -euo pipefail
          mkdir -p logs
          xcodebuild -project itlwm.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -jobs 3 ARCHS=x86_64 \
            SYMROOT="$PWD/build/products" \
            OBJROOT="$PWD/build/obj" \
            CODE_SIGNING_ALLOWED=NO \
            GIT_COMMIT="_$(git rev-parse --short HEAD)" \
            build > "logs/$SCHEME-$CONFIGURATION.log" 2>&1 || {
              tail -100 "logs/$SCHEME-$CONFIGURATION.log"
              exit 1
            }

      - name: Package kext
        env:
          SCHEME: ${{ matrix.scheme }}
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "$SCHEME" in
            itlwm)
              kext_name=itlwm.kext
              ;;
            AirportItlwm-Sequoia|AirportItlwm-Tahoe)
              kext_name=AirportItlwm.kext
              ;;
            *)
              echo "Unexpected scheme: $SCHEME" >&2
              exit 1
              ;;
          esac

          products="$PWD/build/products/$CONFIGURATION"
          kext_path=$(find "$products" -type d -name "$kext_name" -print -quit)
          if [[ -z "$kext_path" ]]; then
            echo "Could not find $kext_name under $products" >&2
            find "$products" -maxdepth 4 -print >&2 || true
            exit 1
          fi

          version=$(awk '/MODULE_VERSION =/ {gsub(/;/, "", $3); print $3; exit}' itlwm.xcodeproj/project.pbxproj)
          short_sha=$(git rev-parse --short HEAD)
          configuration=$(printf '%s' "$CONFIGURATION" | tr '[:lower:]' '[:upper:]')
          archive="artifacts/${SCHEME}-v${version}-${configuration}-${short_sha}.zip"
          ditto -c -k --keepParent "$kext_path" "$archive"

      - name: Upload kext artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.scheme }}-${{ matrix.configuration }}
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.scheme }}-${{ matrix.configuration }}
          path: logs
